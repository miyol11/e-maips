<!--
  HOW TO USE
  1. Open one of your 5 system files (e.g. the Penempatan Guru MAIPs page).
  2. Paste this whole block immediately AFTER the opening <body ...> tag
     (before your <header> or first section).
  3. On the "active" page, add class="active" to that page's section link
     and remove it from the others.
  4. Update every href to match your real filenames (including the
     Log Keluar link, which should point at wherever your logout logic lives,
     e.g. login.html or a logout endpoint).
  5. Repeat for all 5 pages, changing which section link is "active" each time.

  This includes TWO menus:
  - Left: section nav (Penempatan Guru, Arah Kiblat, etc.) — collapses into
    a hamburger on mobile.
  - Right: account menu (hamburger/user icon) with Kemaskini Profil,
    Tukar Kata Laluan, Tukar E-mel, and Log Keluar.
-->

<nav class="app-navbar">
  <div class="navbar-inner">
    <a href="e-digital-landing.html" class="navbar-brand">e-Digital &middot; Perlis</a>

    <button type="button" class="navbar-toggle" id="navToggle" aria-label="Buka menu bahagian">&#9776;</button>

    <ul class="navbar-links" id="navLinks">
      <li><a href="penempatan-guru.html">Penempatan Guru</a></li>
      <li><a href="arah-kiblat.html">Arah Kiblat</a></li>
      <li><a href="tauliah-mengajar.html">Tauliah Mengajar</a></li>
      <li><a href="rekod-guru-maips.html">Rekod Guru MAIPs</a></li>
      <li><a href="kehadiran-program.html">Kehadiran Program</a></li>
    </ul>

    <div class="account-menu-wrap">
      <button type="button" class="account-toggle" id="accountToggle" aria-haspopup="true" aria-expanded="false" aria-label="Menu akaun">
        <span class="account-avatar">A</span>
        <span class="account-hamburger">&#9776;</span>
      </button>
      <ul class="account-menu" id="accountMenu">
        <li><a href="profile.html"><i data-lucide="user-round" class="w-4 h-4"></i> Kemaskini Profil</a></li>
        <li><a href="change-password.html"><i data-lucide="key-round" class="w-4 h-4"></i> Tukar Kata Laluan</a></li>
        <li><a href="change-email.html"><i data-lucide="mail" class="w-4 h-4"></i> Tukar E-mel</a></li>
        <li><a href="help.html"><i data-lucide="circle-help" class="w-4 h-4"></i> Bantuan</a></li>
        <li class="account-menu-divider"></li>
        <li><a href="login.html" class="logout-link"><i data-lucide="log-out" class="w-4 h-4"></i> Log Keluar</a></li>
      </ul>
    </div>
  </div>
</nav>

<style>
  .app-navbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#0d2b22,#173f34);border-bottom:2px solid #c8a55f;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:Arial,sans-serif}
  .app-navbar .navbar-inner{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;position:relative}
  .app-navbar .navbar-brand{color:#f4efe6;font-weight:700;font-size:15px;letter-spacing:.05em;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .app-navbar .navbar-brand::before{content:"";width:8px;height:8px;border-radius:50%;background:#c8a55f}

  .app-navbar .navbar-links{display:flex;list-style:none;margin:0 auto 0 24px;padding:0;gap:4px;flex-wrap:wrap;flex:1}
  .app-navbar .navbar-links a{display:block;padding:8px 14px;border-radius:8px;color:#dfe9df;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
  .app-navbar .navbar-links a:hover{background:rgba(200,165,95,.15);color:#f4efe6}
  .app-navbar .navbar-links a.active{background:#c8a55f;color:#0d2b22}
  .app-navbar .navbar-toggle{display:none;background:none;border:none;color:#f4efe6;font-size:22px;cursor:pointer}

  /* Account menu */
  .account-menu-wrap{position:relative;flex-shrink:0}
  .account-toggle{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(200,165,95,.35);border-radius:999px;padding:6px 10px 6px 6px;cursor:pointer;transition:background .2s,border-color .2s}
  .account-toggle:hover{background:rgba(200,165,95,.15);border-color:#c8a55f}
  .account-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ead9a6,#c8a55f);color:#0d2b22;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
  .account-hamburger{color:#dfe9df;font-size:16px;line-height:1}

  .account-menu{
    display:none;
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    min-width:220px;
    background:#fffefb;
    border:1px solid #e2e8f0;
    border-radius:12px;
    box-shadow:0 16px 40px rgba(0,0,0,.18);
    list-style:none;
    margin:0;
    padding:6px;
    z-index:110;
  }
  .account-menu.open{display:block}
  .account-menu li a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:8px;
    color:#17342c;
    text-decoration:none;
    font-size:13.5px;
    font-weight:500;
    transition:background .15s ease;
  }
  .account-menu li a:hover{background:#f1f5f9}
  .account-menu li a.logout-link{color:#a14d3e}
  .account-menu li a.logout-link:hover{background:#fbf2ef}
  .account-menu-divider{height:1px;background:#e2e8f0;margin:6px 4px}

  @media (max-width:900px){
    .app-navbar .navbar-toggle{display:block}
    .app-navbar .navbar-links{display:none;position:absolute;top:56px;left:0;right:0;background:#173f34;flex-direction:column;padding:8px;border-bottom:2px solid #c8a55f;margin:0}
    .app-navbar .navbar-links.open{display:flex}
    .app-navbar .navbar-links a{padding:10px 14px}
  }
</style>

<script>
  document.getElementById('navToggle').addEventListener('click', function(){
    document.getElementById('navLinks').classList.toggle('open');
    document.getElementById('accountMenu').classList.remove('open');
  });

  const accountToggle = document.getElementById('accountToggle');
  const accountMenu = document.getElementById('accountMenu');

  accountToggle.addEventListener('click', function(e){
    e.stopPropagation();
    const isOpen = accountMenu.classList.toggle('open');
    accountToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    document.getElementById('navLinks').classList.remove('open');
  });

  document.addEventListener('click', function(e){
    if (!accountMenu.contains(e.target) && !accountToggle.contains(e.target)) {
      accountMenu.classList.remove('open');
      accountToggle.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      accountMenu.classList.remove('open');
      accountToggle.setAttribute('aria-expanded', 'false');
    }
  });

  // Optional: hook up real logout logic here instead of just navigating.
  // document.querySelector('.logout-link').addEventListener('click', function(e){
  //   e.preventDefault();
  //   // clear session / call your logout API, then redirect:
  //   window.location.href = 'login.html';
  // });

  if (window.lucide) { lucide.createIcons(); }
</script>
