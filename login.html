<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk — e-Digital</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#082c24;
    --gold:#d7bf84;
    --soft-gold:#eadcb4;
    --mint:#dce9df;
    --line:rgba(215,191,132,.20);
    --error:#e08a7d;
  }

  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%}
  body{
    font-family:'DM Sans',sans-serif;
    background: linear-gradient(145deg, #061f1a, #0a342a, #071f1a);
    min-height:100vh;
  }

  .page-shell{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    isolation:isolate;
    overflow:hidden;
    padding:32px 20px;
    background:
      radial-gradient(circle at 50% 40%, rgba(29,92,73,.52) 0%, rgba(13,61,49,.18) 34%, transparent 64%),
      linear-gradient(145deg, #061f1a 0%, #0b342b 50%, #071f1a 100%);
  }

  .page-shell::before{
    content:"";
    position:absolute;
    inset:-6%;
    z-index:-2;
    opacity:.28;
    background-image:
      linear-gradient(30deg, transparent 48%, var(--line) 49%, var(--line) 51%, transparent 52%),
      linear-gradient(150deg, transparent 48%, var(--line) 49%, var(--line) 51%, transparent 52%);
    background-size:96px 96px, 96px 96px;
  }

  .page-shell::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:radial-gradient(circle at center, transparent 0%, transparent 46%, rgba(2,14,11,.40) 100%);
    pointer-events:none;
  }

  .top-link{
    position:absolute;
    top:24px;
    left:32px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--mint);
    text-decoration:none;
    font-size:13px;
    font-weight:500;
    letter-spacing:.03em;
    opacity:.8;
    transition:opacity .2s ease;
  }
  .top-link:hover{ opacity:1; }
  .top-link:focus-visible{ outline:2px solid var(--soft-gold); outline-offset:3px; }

  .card{
    width:100%;
    max-width:420px;
    background:rgba(13,61,49,.38);
    border:1px solid rgba(215,191,132,.22);
    border-radius:16px;
    padding:44px 38px 38px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:fadeUp .7s ease both;
  }

  .logo-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:22px;
  }
  .logo{
    width:52px;
    height:52px;
    object-fit:contain;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.24));
  }

  .eyebrow{
    text-align:center;
    letter-spacing:.32em;
    text-transform:uppercase;
    font-size:10.5px;
    font-weight:600;
    color:rgba(234,221,185,.85);
    margin-bottom:8px;
  }

  h1{
    text-align:center;
    margin:0 0 6px;
    font-family:'Raleway',sans-serif;
    font-weight:700;
    font-size:30px;
    color:#f6f4ec;
    letter-spacing:.01em;
  }

  .subtitle{
    text-align:center;
    margin:0 0 32px;
    font-size:13.5px;
    color:rgba(232,238,232,.65);
    letter-spacing:.02em;
  }

  form{ display:flex; flex-direction:column; gap:18px; }

  .field{ display:flex; flex-direction:column; gap:7px; }

  label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:rgba(215,191,132,.85);
  }

  .input-wrap{ position:relative; }

  input{
    width:100%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(215,191,132,.25);
    border-radius:9px;
    padding:12px 14px;
    font-size:14.5px;
    color:#f6f4ec;
    font-family:'DM Sans',sans-serif;
    transition:border-color .2s ease, background .2s ease;
  }
  input::placeholder{ color:rgba(232,238,232,.35); }
  input:focus{
    outline:none;
    border-color:var(--gold);
    background:rgba(255,255,255,.09);
  }
  input:focus-visible{ outline:2px solid var(--soft-gold); outline-offset:2px; }

  .toggle-pass{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:rgba(232,238,232,.55);
    font-size:12px;
    letter-spacing:.04em;
    padding:4px 6px;
  }
  .toggle-pass:hover{ color:var(--soft-gold); }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:rgba(232,238,232,.75);
  }
  .remember input[type="checkbox"]{
    width:15px; height:15px;
    accent-color: var(--gold);
    margin:0;
  }

  .forgot{
    color:var(--soft-gold);
    text-decoration:none;
    opacity:.85;
  }
  .forgot:hover{ opacity:1; text-decoration:underline; }

  .error-msg{
    display:none;
    background:rgba(224,138,125,.12);
    border:1px solid rgba(224,138,125,.4);
    color:var(--error);
    font-size:13px;
    padding:10px 14px;
    border-radius:8px;
  }
  .error-msg.show{ display:block; }

  .submit-btn{
    margin-top:6px;
    padding:13px;
    border-radius:999px;
    border:1px solid var(--gold);
    background:linear-gradient(135deg, #ead9a6, var(--gold));
    color:var(--deep);
    font-family:'DM Sans',sans-serif;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:filter .2s ease, transform .15s ease;
  }
  .submit-btn:hover{ filter:brightness(1.08); }
  .submit-btn:active{ transform:scale(.98); }
  .submit-btn:focus-visible{ outline:2px solid var(--soft-gold); outline-offset:3px; }
  .submit-btn:disabled{ opacity:.6; cursor:not-allowed; }

  .divider-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0 20px;
  }
  .divider-row .line{ flex:1; height:1px; background:rgba(215,191,132,.2); }
  .divider-row span{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:rgba(232,238,232,.45);
  }

  .footer-text{
    text-align:center;
    font-size:13.5px;
    color:rgba(232,238,232,.65);
  }
  .footer-text a{
    color:var(--soft-gold);
    text-decoration:none;
    font-weight:600;
  }
  .footer-text a:hover{ text-decoration:underline; }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px)}
    to{opacity:1; transform:translateY(0)}
  }

  @media (max-width:480px){
    .card{ padding:36px 24px 30px; }
    .top-link{ top:16px; left:16px; }
    h1{ font-size:26px; }
  }
</style>
</head>
<body>
  <main class="page-shell">
    <a class="top-link" href="e-digital-landing.html">&larr; Kembali</a>

    <div class="card">
      
      <div class="eyebrow">e-Digital</div>
      <h1>Log Masuk</h1>
      <p class="subtitle">Sistem Pengurusan Bahagian Falak dan Pengajaran</p>

      <form id="loginForm" novalidate>
        <div class="error-msg" id="loginError">E-mel atau kata laluan tidak sah.</div>

        <div class="field">
          <label for="email">E-mel</label>
          <input type="email" id="email" name="email" placeholder="nama@gmail.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Kata Laluan</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Masukkan kata laluan" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Tunjukkan kata laluan">SHOW</button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember">
            Ingat saya
          </label>
          <a class="forgot" href="#">Lupa kata laluan?</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Log Masuk</button>
      </form>

      <div class="divider-row"><span class="line"></span><span>atau</span><span class="line"></span></div>

      <p class="footer-text">Belum ada akaun? <a href="register.html">Daftar sekarang</a></p>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    const submitBtn = document.getElementById('submitBtn');
    const togglePass = document.getElementById('togglePass');
    const passwordInput = document.getElementById('password');

    togglePass.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      togglePass.textContent = isHidden ? 'HIDE' : 'SHOW';
      togglePass.setAttribute('aria-label', isHidden ? 'Sembunyikan kata laluan' : 'Tunjukkan kata laluan');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');

      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        errorBox.textContent = 'Sila isi e-mel dan kata laluan.';
        errorBox.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sedang log masuk...';

      // Placeholder: replace with your real authentication call
      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log Masuk';
        errorBox.textContent = 'E-mel atau kata laluan tidak sah.';
        errorBox.classList.add('show');
      }, 900);
    });
  </script>
</body>
</html>
