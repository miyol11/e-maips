<style>
  :root{
    --deep:#082c24;
    --deep-2:#0d3d31;
    --gold:#d7bf84;
    --soft-gold:#eadcb4;
    --mint:#dce9df;
    --line:rgba(215,191,132,.20);
  }

  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%}
  body{
    font-family:'DM Sans',sans-serif;
    overflow:hidden;
    background: linear-gradient(145deg, #061f1a, #0a342a, #071f1a);
  }

  .page-shell{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    isolation:isolate;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 40%, rgba(29,92,73,.52) 0%, rgba(13,61,49,.18) 34%, transparent 64%),
      linear-gradient(145deg, #061f1a 0%, #0b342b 50%, #071f1a 100%);
  }

  .page-shell::before{
    content:"";
    position:absolute;
    inset:-6%;
    z-index:-3;
    opacity:.28;
    background-image:
      linear-gradient(30deg, transparent 48%, var(--line) 49%, var(--line) 51%, transparent 52%),
      linear-gradient(150deg, transparent 48%, var(--line) 49%, var(--line) 51%, transparent 52%),
      linear-gradient(90deg, transparent 48%, rgba(215,191,132,.10) 49%, rgba(215,191,132,.10) 51%, transparent 52%);
    background-size:96px 96px, 96px 96px, 96px 96px;
  }

  .page-shell::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(circle at center, transparent 0%, transparent 46%, rgba(2,14,11,.40) 100%),
      linear-gradient(to bottom, rgba(255,255,255,.02), rgba(0,0,0,.16));
    pointer-events:none;
  }

  .ornament-field{
    position:absolute;
    inset:0;
    z-index:-2;
    opacity:.34;
    background-image:
      radial-gradient(circle at center, transparent 0 17px, rgba(215,191,132,.22) 18px 19px, transparent 20px),
      linear-gradient(45deg, transparent 46%, rgba(215,191,132,.11) 47%, rgba(215,191,132,.11) 53%, transparent 54%),
      linear-gradient(-45deg, transparent 46%, rgba(215,191,132,.11) 47%, rgba(215,191,132,.11) 53%, transparent 54%);
    background-size:188px 188px, 188px 188px, 188px 188px;
    mask-image:radial-gradient(circle at center, black 0%, black 60%, transparent 100%);
    -webkit-mask-image:radial-gradient(circle at center, black 0%, black 60%, transparent 100%);
  }

  .corner{
    position:absolute;
    width:270px;
    height:270px;
    border:1px solid rgba(215,191,132,.16);
    transform:rotate(45deg);
    opacity:.62;
  }

  .corner::before,
  .corner::after{
    content:"";
    position:absolute;
    border:1px solid rgba(215,191,132,.14);
  }

  .corner::before{ inset:30px; }
  .corner::after{ inset:62px; }

  .corner.tl{left:-135px;top:-135px}
  .corner.br{right:-135px;bottom:-135px}

  /* Auth buttons */
  .auth-bar{
    position:absolute;
    top:24px;
    right:32px;
    z-index:5;
    display:flex;
    gap:12px;
    animation:fadeIn 1s .1s ease both;
  }

  .auth-btn{
    font-family:'DM Sans',sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:10px 24px;
    border-radius:999px;
    cursor:pointer;
    border:1px solid rgba(215,191,132,.45);
    background:transparent;
    color:var(--mint);
    transition:all .25s ease;
  }

  .auth-btn:hover{
    background:rgba(215,191,132,.12);
    border-color:rgba(215,191,132,.75);
  }

  .auth-btn:focus-visible{
    outline:2px solid var(--soft-gold);
    outline-offset:2px;
  }

  .auth-btn.primary{
    background:linear-gradient(135deg, #ead9a6, var(--gold));
    color:var(--deep);
    border:1px solid var(--gold);
  }

  .auth-btn.primary:hover{
    filter:brightness(1.08);
  }

  @media (max-width:640px){
    .auth-bar{ top:16px; right:16px; gap:8px; }
    .auth-btn{ padding:8px 16px; font-size:11px; }
  }

  .hero{
    width:min(92%, 1100px);
    padding:48px 24px;
    text-align:center;
    color:white;
    position:relative;
  }

  .logo-container{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:32px;
    margin-bottom:28px;
    animation:fadeUp .85s ease both;
  }

  .logo{
    width:160px;
    height:160px;
    object-fit:contain;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.24));
    transition:transform .3s ease;
  }

  .logo:hover{
    transform:scale(1.05);
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:14px;
    margin-bottom:24px;
    letter-spacing:.36em;
    text-transform:uppercase;
    font-size:11px;
    font-weight:600;
    color:rgba(234,221,185,.9);
    animation:fadeUp .85s ease both;
  }

  .slide-banner{
    width:min(85%, 520px);
    margin:24px auto 28px;
    padding:12px 24px;
    background:rgba(220,233,223,.08);
    border-top:1px solid rgba(215,191,132,.24);
    border-bottom:1px solid rgba(215,191,132,.24);
    animation:slideDown 1s .30s ease both;
  }

  .banner-text{
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(215,191,132,.82);
    font-weight:500;
    margin:0;
  }

  @keyframes slideDown{
    from{opacity:0; transform:translateY(-12px)}
    to{opacity:1; transform:translateY(0)}
  }

  .eyebrow::before,
  .eyebrow::after{
    content:"";
    display:block;
    width:42px;
    height:1px;
    background:linear-gradient(to right, transparent, rgba(215,191,132,.8));
  }

  .eyebrow::after{
    background:linear-gradient(to left, transparent, rgba(215,191,132,.8));
  }

  .title{
    margin:0;
    font-family:'Raleway',sans-serif;
    font-weight:700;
    line-height:.96;
    letter-spacing:-.045em;
    font-size:clamp(56px, 9.5vw, 122px);
    color:#f6f4ec;
    text-shadow:0 8px 34px rgba(0,0,0,.18);
    animation:fadeUp 1s .12s ease both;
  }

  .divider{
    width:min(250px, 42vw);
    height:24px;
    margin:30px auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    animation:fadeUp 1s .24s ease both;
  }

  .divider::before,
  .divider::after{
    content:"";
    height:1px;
    flex:1;
    background:linear-gradient(to right, transparent, rgba(215,191,132,.76));
  }

  .divider::after{
    background:linear-gradient(to left, transparent, rgba(215,191,132,.76));
  }

  .diamond{
    width:10px;
    height:10px;
    border:1px solid rgba(224,203,151,.92);
    transform:rotate(45deg);
    box-shadow:0 0 14px rgba(215,191,132,.18);
  }

  .subtitle{
    margin:0 auto;
    max-width:700px;
    color:rgba(232,238,232,.84);
    font-size:clamp(15px, 1.7vw, 19px);
    line-height:1.75;
    font-weight:400;
    letter-spacing:.08em;
    animation:fadeUp 1s .36s ease both;
    white-space:pre-line;
  }

  .org-name{
    margin-top:36px;
    font-size:28px;
    letter-spacing:.692rem;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    animation:fadeUp 1s .48s ease both;
  }

  #datetime-display{
    margin-top:24px;
    padding:16px 24px;
    font-size:21px;
    font-weight:700;
    color:var(--deep);
    letter-spacing:.08em;
    animation:fadeUp 1s .56s ease both;
    background:rgba(255,255,255,.95);
    border-radius:8px;
    display:inline-block;
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px)}
    to{opacity:1; transform:translateY(0)}
  }

  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }

  @media (max-width:640px){
    .hero{padding:36px 18px}
    .eyebrow{
      gap:10px;
      letter-spacing:.22em;
      font-size:10px;
      margin-bottom:20px;
    }
    .eyebrow::before,
    .eyebrow::after{width:24px}
    .subtitle{
      letter-spacing:.04em;
      line-height:1.65;
    }
    .org-name{ font-size:16px; letter-spacing:.3rem; }
    .corner{width:180px;height:180px}
    .corner.tl{left:-90px;top:-90px}
    .corner.br{right:-90px;bottom:-90px}
  }
</style>
</head>

        year: 'numeric',
        month: 'short',
        day: '2-digit',
        hour: '2-digit',
