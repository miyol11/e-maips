<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — e-Digital</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#082c24;
    --gold:#d7bf84;
    --soft-gold:#eadcb4;
    --mint:#dce9df;
    --line:rgba(215,191,132,.20);
    --error:#e08a7d;
    --ok:#8fc9a8;
  }

  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%}
  body{
    font-family:'DM Sans',sans-serif;
    background: linear-gradient(145deg, #061f1a, #0a342a, #071f1a);
    min-height:100vh;
  }

  .page-shell{
    position:relative;
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    isolation:isolate;
    overflow:hidden;
    padding:32px 20px;
    background:
      radial-gradient(circle at 50% 40%, rgba(29,92,73,.52) 0%, rgba(13,61,49,.18) 34%, transparent 64%),
      linear-gradient(145deg, #061f1a 0%, #0b342b 50%, #071f1a 100%);
  }

  .page-shell::before{
    content:"";
    position:absolute;
    inset:-6%;
    z-index:-2;
    opacity:.28;
    background-image:
      linear-gradient(30deg, transparent 48%, var(--line) 49%, var(--line) 51%, transparent 52%),
      linear-gradient(150deg, transparent 48%, var(--line) 49%, var(--line) 51%, transparent 52%);
    background-size:96px 96px, 96px 96px;
  }

  .page-shell::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:radial-gradient(circle at center, transparent 0%, transparent 46%, rgba(2,14,11,.40) 100%);
    pointer-events:none;
  }

  .top-link{
    position:absolute;
    top:24px;
    left:32px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--mint);
    text-decoration:none;
    font-size:13px;
    font-weight:500;
    letter-spacing:.03em;
    opacity:.8;
    transition:opacity .2s ease;
  }
  .top-link:hover{ opacity:1; }
  .top-link:focus-visible{ outline:2px solid var(--soft-gold); outline-offset:3px; }

  .card{
    width:100%;
    max-width:460px;
    background:rgba(13,61,49,.38);
    border:1px solid rgba(215,191,132,.22);
    border-radius:16px;
    padding:44px 38px 38px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 60px rgba(0,0,0,.35);
    animation:fadeUp .7s ease both;
  }

  .logo-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:22px;
  }
  .logo{
    width:52px;
    height:52px;
    object-fit:contain;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.24));
  }

  .eyebrow{
    text-align:center;
    letter-spacing:.32em;
    text-transform:uppercase;
    font-size:10.5px;
    font-weight:600;
    color:rgba(234,221,185,.85);
    margin-bottom:8px;
  }

  h1{
    text-align:center;
    margin:0 0 6px;
    font-family:'Raleway',sans-serif;
    font-weight:700;
    font-size:30px;
    color:#f6f4ec;
    letter-spacing:.01em;
  }

  .subtitle{
    text-align:center;
    margin:0 0 30px;
    font-size:13.5px;
    color:rgba(232,238,232,.65);
    letter-spacing:.02em;
  }

  form{ display:flex; flex-direction:column; gap:16px; }

  .field-row{ display:flex; gap:14px; }
  .field{ display:flex; flex-direction:column; gap:7px; flex:1; }

  label{
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:rgba(215,191,132,.85);
  }

  .input-wrap{ position:relative; }

  input, select{
    width:100%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(215,191,132,.25);
    border-radius:9px;
    padding:12px 14px;
    font-size:14.5px;
    color:#f6f4ec;
    font-family:'DM Sans',sans-serif;
    transition:border-color .2s ease, background .2s ease;
  }
  input::placeholder{ color:rgba(232,238,232,.35); }
  input:focus, select:focus{
    outline:none;
    border-color:var(--gold);
    background:rgba(255,255,255,.09);
  }
  input:focus-visible, select:focus-visible{ outline:2px solid var(--soft-gold); outline-offset:2px; }

  select{ cursor:pointer; }
  select option{ background:#0d3d31; color:#f6f4ec; }

  .toggle-pass{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    color:rgba(232,238,232,.55);
    font-size:12px;
    letter-spacing:.04em;
    padding:4px 6px;
  }
  .toggle-pass:hover{ color:var(--soft-gold); }

  .hint{
    font-size:11.5px;
    color:rgba(232,238,232,.45);
    margin-top:2px;
  }

  .strength-bar{
    height:4px;
    border-radius:3px;
    background:rgba(255,255,255,.08);
    overflow:hidden;
    margin-top:4px;
  }
  .strength-fill{
    height:100%;
    width:0%;
    background:var(--error);
    transition:width .25s ease, background .25s ease;
  }

  .terms{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:12.5px;
    color:rgba(232,238,232,.7);
    line-height:1.5;
  }
  .terms input[type="checkbox"]{
    width:15px; height:15px;
    accent-color: var(--gold);
    margin-top:2px;
    flex-shrink:0;
  }
  .terms a{ color:var(--soft-gold); text-decoration:none; }
  .terms a:hover{ text-decoration:underline; }

  .error-msg{
    display:none;
    background:rgba(224,138,125,.12);
    border:1px solid rgba(224,138,125,.4);
    color:var(--error);
    font-size:13px;
    padding:10px 14px;
    border-radius:8px;
  }
  .error-msg.show{ display:block; }

  .success-msg{
    display:none;
    background:rgba(143,201,168,.12);
    border:1px solid rgba(143,201,168,.4);
    color:var(--ok);
    font-size:13px;
    padding:10px 14px;
    border-radius:8px;
  }
  .success-msg.show{ display:block; }

  .submit-btn{
    margin-top:6px;
    padding:13px;
    border-radius:999px;
    border:1px solid var(--gold);
    background:linear-gradient(135deg, #ead9a6, var(--gold));
    color:var(--deep);
    font-family:'DM Sans',sans-serif;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:filter .2s ease, transform .15s ease;
  }
  .submit-btn:hover{ filter:brightness(1.08); }
  .submit-btn:active{ transform:scale(.98); }
  .submit-btn:focus-visible{ outline:2px solid var(--soft-gold); outline-offset:3px; }
  .submit-btn:disabled{ opacity:.6; cursor:not-allowed; }

  .footer-text{
    text-align:center;
    margin-top:22px;
    font-size:13.5px;
    color:rgba(232,238,232,.65);
  }
  .footer-text a{
    color:var(--soft-gold);
    text-decoration:none;
    font-weight:600;
  }
  .footer-text a:hover{ text-decoration:underline; }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px)}
    to{opacity:1; transform:translateY(0)}
  }

  @media (max-width:480px){
    .card{ padding:36px 22px 30px; }
    .top-link{ top:16px; left:16px; }
    h1{ font-size:26px; }
    .field-row{ flex-direction:column; gap:16px; }
  }
</style>
</head>
<body>
  <main class="page-shell">
    <a class="top-link" href="e-digital-landing.html">&larr; Kembali</a>

    <div class="card">

      <div class="eyebrow">e-Digital</div>
      <h1>Daftar Akaun</h1>
      <p class="subtitle">Sistem Pengurusan Bahagian Falak dan Pengajaran</p>

      <form id="registerForm" novalidate>
        <div class="error-msg" id="formError"></div>
        <div class="success-msg" id="formSuccess">Pendaftaran berjaya! Mengalihkan ke log masuk...</div>

        <div class="field-row">
          <div class="field">
            <label for="fullname">Nama Penuh</label>
            <input type="text" id="fullname" name="fullname" placeholder="Nama seperti IC" autocomplete="name" required>
          </div>
        </div>

        <div class="field">
          <label for="ic">No. Kad Pengenalan</label>
          <input type="text" id="ic" name="ic" placeholder="XXXXXX-XX-XXXX" maxlength="14" required>
        </div>

        <div class="field">
          <label for="email">E-mel</label>
          <input type="email" id="email" name="email" placeholder="nama@gmail.com" autocomplete="email" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="phone">No. Telefon</label>
            <input type="tel" id="phone" name="phone" placeholder="01X-XXXXXXX" autocomplete="tel" required>
          </div>
          <div class="field">
            <label for="category">Kategori</label>
            <select id="category" name="category" required>
              <option value="">Pilih</option>
              <option value="pelajar">Pelajar</option>
              <option value="tenaga-pengajar">Tenaga Pengajar</option>
              <option value="orang-awam">Orang Awam</option>
              <option value="kakitangan">Kakitangan Jabatan</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="password">Kata Laluan</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Sekurang-kurangnya 8 aksara" autocomplete="new-password" required>
            <button type="button" class="toggle-pass" id="togglePass1" aria-label="Tunjukkan kata laluan">TUNJUK</button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <p class="hint" id="strengthLabel">Gunakan huruf besar, nombor dan simbol untuk kata laluan lebih kukuh.</p>
        </div>

        <div class="field">
          <label for="confirmPassword">Sahkan Kata Laluan</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Masukkan semula kata laluan" autocomplete="new-password" required>
            <button type="button" class="toggle-pass" id="togglePass2" aria-label="Tunjukkan kata laluan">TUNJUK</button>
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" name="terms" required>
          <span>Saya bersetuju dengan <a href="#">Terma Perkhidmatan</a> dan <a href="#">Dasar Privasi</a> Jabatan Mufti Negeri Perlis.</span>
        </label>

        <button type="submit" class="submit-btn" id="submitBtn">Daftar Akaun</button>
      </form>

      <p class="footer-text">Sudah ada akaun? <a href="login.html">Log masuk</a></p>
    </div>
  </main>

  <script>
    const form = document.getElementById('registerForm');
    const errorBox = document.getElementById('formError');
    const successBox = document.getElementById('formSuccess');
    const submitBtn = document.getElementById('submitBtn');

    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const strengthFill = document.getElementById('strengthFill');
    const strengthLabel = document.getElementById('strengthLabel');

    function togglePassword(btnId, inputEl) {
      const btn = document.getElementById(btnId);
      btn.addEventListener('click', () => {
        const isHidden = inputEl.type === 'password';
        inputEl.type = isHidden ? 'text' : 'password';
        btn.textContent = isHidden ? 'SEMBUNYI' : 'TUNJUK';
      });
    }
    togglePassword('togglePass1', password);
    togglePassword('togglePass2', confirmPassword);

    password.addEventListener('input', () => {
      const val = password.value;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const pct = (score / 4) * 100;
      strengthFill.style.width = pct + '%';

      const colors = ['#e08a7d', '#e0a97d', '#d7bf84', '#8fc9a8'];
      const labels = ['Lemah', 'Sederhana', 'Baik', 'Kukuh'];
      const idx = Math.max(score - 1, 0);
      strengthFill.style.background = val ? colors[idx] : 'rgba(255,255,255,.08)';
      strengthLabel.textContent = val
        ? `Kekuatan kata laluan: ${labels[idx]}`
        : 'Gunakan huruf besar, nombor dan simbol untuk kata laluan lebih kukuh.';
    });

    // Auto-format IC number: XXXXXX-XX-XXXX
    document.getElementById('ic').addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 12);
      if (v.length > 6) v = v.slice(0,6) + '-' + v.slice(6);
      if (v.length > 9) v = v.slice(0,9) + '-' + v.slice(9);
      e.target.value = v;
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      successBox.classList.remove('show');

      const requiredFields = ['fullname','ic','email','phone','category','password','confirmPassword'];
      for (const id of requiredFields) {
        if (!document.getElementById(id).value.trim()) {
          errorBox.textContent = 'Sila lengkapkan semua maklumat.';
          errorBox.classList.add('show');
          return;
        }
      }

      if (!document.getElementById('terms').checked) {
        errorBox.textContent = 'Sila bersetuju dengan Terma Perkhidmatan dan Dasar Privasi.';
        errorBox.classList.add('show');
        return;
      }

      if (password.value.length < 8) {
        errorBox.textContent = 'Kata laluan mesti sekurang-kurangnya 8 aksara.';
        errorBox.classList.add('show');
        return;
      }

      if (password.value !== confirmPassword.value) {
        errorBox.textContent = 'Kata laluan dan pengesahan tidak sepadan.';
        errorBox.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Menghantar...';

      // Placeholder: replace with your real registration API call
      setTimeout(() => {
        successBox.classList.add('show');
        submitBtn.textContent = 'Berjaya';
      }, 900);
    });
  </script>
</body>
</html>
